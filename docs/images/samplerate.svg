<text x="120.0" y="346.0" class="tick" text-anchor="middle" >0</text>
<line x1="204.0" y1="84.0" x2="204.0" y2="330.0" style="stroke:var(--grid);stroke-width:1"/>
<text x="204.0" y="346.0" class="tick" text-anchor="middle" >20</text>
<line x1="288.0" y1="84.0" x2="288.0" y2="330.0" style="stroke:var(--grid);stroke-width:1"/>
<text x="288.0" y="346.0" class="tick" text-anchor="middle" >40</text>
<line x1="372.0" y1="84.0" x2="372.0" y2="330.0" style="stroke:var(--grid);stroke-width:1"/>
<text x="372.0" y="346.0" class="tick" text-anchor="middle" >60</text>
<line x1="456.0" y1="84.0" x2="456.0" y2="330.0" style="stroke:var(--grid);stroke-width:1"/>
<text x="456.0" y="346.0" class="tick" text-anchor="middle" >80</text>
<line x1="540.0" y1="84.0" x2="540.0" y2="330.0" style="stroke:var(--grid);stroke-width:1"/>
<text x="540.0" y="346.0" class="tick" text-anchor="middle" >100 MB/s</text>
<line x1="120.0" y1="84.0" x2="120.0" y2="330.0" style="stroke:var(--axis);stroke-width:1"/>
<text x="554.0" y="80.0" class="sm halo" text-anchor="start" >所需数据率</text>
<path d="M120.0,96.0 H374.0 a4.0,4.0 0 0 1 4.0,4.0 V118.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="114.0" class="bt" text-anchor="end" >15.36 MSPS</text>
<text x="554.0" y="114.0" class="v halo" text-anchor="start" >61.4 MB/s</text>
<circle cx="650" cy="109.0" r="8" style="fill:var(--good)"/>
<path d="M645,109.0 l3,3 l6,-6" style="stroke:#fff;stroke-width:2;fill:none"/>
<text x="664.0" y="114.0" class="lb" text-anchor="start" >连续，0 断档</text>
<path d="M120.0,134.0 H410.0 a4.0,4.0 0 0 1 4.0,4.0 V156.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="152.0" class="bt" text-anchor="end" >17.5 MSPS</text>
