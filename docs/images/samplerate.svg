<text x="664.0" y="152.0" class="lb" text-anchor="start" >连续，0 断档</text>
<path d="M120.0,172.0 H426.8 a4.0,4.0 0 0 1 4.0,4.0 V194.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="190.0" class="bt" text-anchor="end" >18.5 MSPS</text>
<text x="554.0" y="190.0" class="v halo" text-anchor="start" >74.0 MB/s</text>
<circle cx="650" cy="185.0" r="8" style="fill:var(--good)"/>
<path d="M645,185.0 l3,3 l6,-6" style="stroke:#fff;stroke-width:2;fill:none"/>
<text x="664.0" y="190.0" class="lb" text-anchor="start" >连续，0 断档</text>
<path d="M120.0,210.0 H452.0 a4.0,4.0 0 0 1 4.0,4.0 V232.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="228.0" class="bt" text-anchor="end" >20 MSPS</text>
<text x="554.0" y="228.0" class="v halo" text-anchor="start" >80.0 MB/s</text>
<circle cx="650" cy="223.0" r="8" style="fill:var(--good)"/>
<path d="M645,223.0 l3,3 l6,-6" style="stroke:#fff;stroke-width:2;fill:none"/>
<text x="664.0" y="228.0" class="lb" text-anchor="start" >连续，0 断档</text>
<path d="M120.0,248.0 H468.8 a4.0,4.0 0 0 1 4.0,4.0 V270.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="266.0" class="bt" text-anchor="end" >21 MSPS</text>
<text x="554.0" y="266.0" class="v halo" text-anchor="start" >84.0 MB/s</text>
<circle cx="650" cy="261.0" r="8" style="fill:var(--good)"/>
<path d="M645,261.0 l3,3 l6,-6" style="stroke:#fff;stroke-width:2;fill:none"/>
<text x="664.0" y="266.0" class="lb" text-anchor="start" >连续，0 断档</text>
<path d="M120.0,286.0 H485.6 a4.0,4.0 0 0 1 4.0,4.0 V308.0 a4.0,4.0 0 0 1 -4.0,4.0 H120.0 Z" style="fill:var(--s1)"/>
<text x="108.0" y="304.0" class="bt" text-anchor="end" >22 MSPS</text>
