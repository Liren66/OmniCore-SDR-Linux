# Try DHCP first; if no lease within 5 s use the PlutoSDR-style static address.
# A DHCP server answers in well under a second (rapid_commit), so a direct cable
# to a PC reaches 192.168.2.1 about 15 s sooner than with the old 20 s. The
# static address is never added next to a DHCP lease: on a LAN where
# 192.168.2.1 is the router it would conflict. Unplugging and replugging the
# cable restarts DHCP.
hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
timeout 5

# The static address is ARP-probed (~6 s) before use. Keep it: "noarp" also drops
# the gratuitous ARP announcement, and a Windows PC that tried 192.168.2.1 during
# the boot then keeps it "unreachable" for about a minute.
profile pluto_static
static ip_address=192.168.2.1/24

interface eth0
fallback pluto_static
