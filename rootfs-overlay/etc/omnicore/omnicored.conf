# omnicored configuration (key = value)

# AXI UART16550 tty connected to CH32 USART1 (OCH command link, 3.125 MBd).
tty = /dev/ttyS1

# AD9361 SPI clock for USB mode. 0 = same as the bare-metal SDK (166.67 MHz / 256
# = 651 kHz). The PS SPI divides 166.67 MHz by a power of two and never exceeds
# the request. 2604166 = /64, the clock the kernel ad9361 driver uses on this bus
# in libiio mode; RF init 1.32 s -> 1.20 s (the rest is AD9361 calibration time).
spi_hz = 2604166

# libiio over Ethernet. omnicored owns listen_port and runs "<iiod> -i" for each
# connection, with the connection as its stdin/stdout. The OmniCore iiod
# (/usr/local/sbin/iiod) sends samples straight from the DMA blocks (zero-copy);
# Debian's /usr/sbin/iiod also works, but copies every sample (slower).
iio_enable = 1
listen_port = 30431
iiod = /usr/local/sbin/iiod

# A libiio connection takes the AD9361 only when USB RX/TX and DDS TX are off and
# no OCH command arrived for quiet_ms; otherwise the client gets EBUSY (16).
# USB mode returns grace_ms after the last libiio client disconnects.
quiet_ms = 3000
grace_ms = 5000

# OCH has priority: an OCH command while libiio owns the AD9361 disconnects the
# libiio clients, returns the AD9361 to USB mode and then runs.
# 0 = answer "ERR busy owner=libiio" instead.
och_preempt = 1

# Real-time USB mode: SCHED_FIFO priority of the main loop (0 = normal
# scheduling), its CPU (iiod runs there too, away from the Ethernet
# interrupt), and the CPU for the CH32/UART/SPI/PPS interrupts
# (-1 = leave as is). Ethernet and SD interrupts stay on CPU0.
rt_priority = 50
cpu = 1
irq_cpu = 1
